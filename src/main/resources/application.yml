spring:
  application:
    name: brideside-crm-backend

  datasource:
    url: jdbc:mysql://${DB_HOST:thebrideside.mysql.database.azure.com:3306}/${DB_DATABASE:thebrideside}?useSSL=${DB_SSL:true}&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&useUnicode=true&autoReconnect=true&failOverReadOnly=false&maxReconnects=10&createDatabaseIfNotExist=true&tcpKeepAlive=true&tcpNoDelay=true&connectTimeout=30000&socketTimeout=60000
    username: ${DB_USER:thebrideside}
    password: ${DB_PASSWORD:TheBride@260799}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      idle-timeout: 240000  # 4 minutes - connections idle longer than this will be removed
      max-lifetime: 300000  # 5 minutes (must be less than MySQL wait_timeout, Azure typically closes at 7-8 minutes)
      connection-timeout: 30000  # 30 seconds
      validation-timeout: 3000  # 3 seconds
      leak-detection-threshold: 60000
      connection-test-query: SELECT 1  # Test query to validate connections before use
      keepalive-time: 120000  # 2 minutes - send keepalive packets to prevent server from closing connections
      register-mbeans: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    open-in-view: ${JPA_OPEN_IN_VIEW:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: ${JPA_FORMAT_SQL:false}
        use_sql_comments: ${JPA_USE_SQL_COMMENTS:false}
        default_batch_fetch_size: ${JPA_DEFAULT_BATCH_FETCH_SIZE:50}
        # Force VARCHAR instead of ENUM for string enums
        globally_quoted_identifiers: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:shubham@acceltancy.in}
    password: ${MAIL_PASSWORD:cmehguwwjialwhvf}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

jwt:
  secret: ${JWT_SECRET:your-secret-key-change-this-in-production-use-a-long-random-string}
  expiration: 86400000 # 24 hours in milliseconds

app:
  frontend:
    base-url: ${FRONTEND_URL:https://tbscrm-frontend-cjcyene4bvc3d2gs.canadacentral-01.azurewebsites.net}
    invitation-path: ${FRONTEND_INVITATION_PATH:/accept-invitation}
    reset-path: ${FRONTEND_RESET_PATH:/reset-password}
    login-path: ${FRONTEND_LOGIN_PATH:/login}
  invitation-token-validity: 604800000 # 7 days in milliseconds
  password-reset-token-validity: 24 # 24 hours
  email:
    from: ${MAIL_FROM:shubham@acceltancy.in}
    from-name: ${MAIL_FROM_NAME:Brideside CRM}
  tbs:
    # The Bride Side (Brideside) pipeline & org for auto-diverted deal copies
    brideside-pipeline-id: ${TBS_BRIDESIDE_PIPELINE_ID:67}
    brideside-organization-id: ${TBS_BRIDESIDE_ORGANIZATION_ID:68}
    # deals.category_id for those copies (FK to categories.id)
    brideside-deal-category-id: ${TBS_BRIDESIDE_DEAL_CATEGORY_ID:4}
  reports:
    timezone: ${REPORT_TZ:Asia/Kolkata}
    daily:
      enabled: ${DAILY_REPORT_ENABLED:false}
      # Cron format: second minute hour day-of-month month day-of-week
      # Example 9:00 AM daily: "0 0 9 * * *"
      cron: ${DAILY_REPORT_CRON:0 0 9 * * *}
      # Comma-separated list of recipients for scheduled sends
      recipients: ${DAILY_REPORT_RECIPIENTS:}

springdoc:
  api-docs:
    path: /api-docs
    groups:
      enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /api-docs/all
    urls:
      - name: persons
        url: /api-docs/persons
      - name: activities
        url: /api-docs/activities
      - name: all
        url: /api-docs/all
    urlsPrimaryName: all
  cache:
    disabled: true

logging:
  level:
    org.springframework.security: ${LOG_SECURITY_LEVEL:INFO}
    com.brideside.crm: ${LOG_APP_LEVEL:INFO}

google:
  calendar:
    enabled: ${GOOGLE_CALENDAR_ENABLED:false}
    application-name: ${GOOGLE_CALENDAR_APP_NAME:Brideside CRM}
    credentials-file: ${GOOGLE_CALENDAR_CREDENTIALS_FILE:}
    credentials-json: ${GOOGLE_CALENDAR_CREDENTIALS_JSON:}
    impersonated-user: ${GOOGLE_CALENDAR_IMPERSONATED_USER:}
    poll-interval-minutes: ${GOOGLE_CALENDAR_POLL_MINUTES:10}
    sync-window-past-days: ${GOOGLE_CALENDAR_SYNC_PAST_DAYS:30}
    sync-window-future-days: ${GOOGLE_CALENDAR_SYNC_FUTURE_DAYS:120}

azure:
  storage:
    blob:
      connection-string: ${AZURE_STORAGE_BLOB_CONNECTION_STRING:}
      container-name: ${AZURE_STORAGE_BLOB_CONTAINER_NAME:call-screenshots}
      base-url: ${AZURE_STORAGE_BLOB_BASE_URL:}

ola:
  maps:
    enabled: ${OLA_MAPS_ENABLED:true}
    base-url: ${OLA_MAPS_BASE_URL:https://api.olamaps.io}
    client-id: ${OLA_MAPS_CLIENT_ID:81dd884f-9e2f-46d1-9133-e5a92760937e}
    client-secret: ${OLA_MAPS_CLIENT_SECRET:ce49cc6df9fb4ac69ab047ef0d627f5f}
    timeout: ${OLA_MAPS_TIMEOUT:10000}

